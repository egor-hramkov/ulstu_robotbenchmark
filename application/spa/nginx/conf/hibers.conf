
server {
    listen 11670 default_server ssl;
    listen [::]:11670 ssl;
    http2  on;

    server_name localhost virtual.robocross.ru;

    ssl_certificate /etc/letsencrypt/live/virtual.robocross.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/virtual.robocross.ru/privkey.pem;

    location / {
        proxy_pass http://virtual.robocross.ru:11669;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
#	proxy_set_header Referer $http_referer;
	add_header P3P 'CP=""';
	add_header X-Debug-Proto $scheme;

	# WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}


# VS Code server
server {
    listen 11401 ssl;
    listen [::]:11401 ssl;
    http2  on;
    server_name virtual.robocross.ru;

    ssl_certificate /etc/letsencrypt/live/virtual.robocross.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/virtual.robocross.ru/privkey.pem;

    location / {
        proxy_pass http://localhost:11400;

    	auth_request /auth_check;
        proxy_set_header X-Server-Port $server_port;
        proxy_set_header Authorization $http_authorization;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade, Keep-Alive";
	
	    proxy_set_header Origin "https://virtual.robocross.ru";
        proxy_set_header Host "virtual.robocross.ru";	

        # WebSocket
        proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
        proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;
        proxy_set_header Sec-WebSocket-Extensions $http_sec_websocket_extensions;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 86400s;	
    }
    # Внутренний маршрут для проверки JWT через Django
    location = /auth_check {
        internal;
        proxy_pass https://virtual.robocross.ru:444/api/check-pu-access/;  # Эндпоинт для проверки JWT
        proxy_set_header Authorization $http_authorization;
    	proxy_set_header X-Server-Port $server_port;  # Передаем порт
        proxy_pass_request_body off;  # Не передаем тело запроса
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }    
}

server {
    listen 10377 default_server ssl;
    listen [::]:10377 ssl;
    http2  on;

    server_name localhost virtual.robocross.ru;

    ssl_certificate /etc/letsencrypt/live/virtual.robocross.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/virtual.robocross.ru/privkey.pem;

    location / {
        proxy_pass http://localhost:10376;
        proxy_http_version 1.1;

        # WebSocket Upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        # Оставляем корректные заголовки
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket-specific заголовки
        proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
        proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;
        proxy_set_header Sec-WebSocket-Extensions $http_sec_websocket_extensions;

        # Длинные таймауты для стабильности WebSocket
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 86400s;
    }
}

