server {
    listen       80;
    listen [::]:80;    
    server_name  localhost virtual.robocross.ru;
    server_tokens off;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri /index.html;                 
        #return 301 http://virtual.robocross.ru:8000$request_uri;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

}

server {
    listen 443 default_server ssl http2;
    listen [::]:443 ssl http2;

    server_name localhost virtual.robocross.ru;

    ssl_certificate /etc/letsencrypt/live/virtual.robocross.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/virtual.robocross.ru/privkey.pem;
    auth_basic off;

    location / {
    	proxy_pass http://virtual.robocross.ru;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header Host $host;
    	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;	

	# WebSocket support
    	proxy_http_version 1.1;
    	proxy_set_header Upgrade $http_upgrade;
    	proxy_set_header Connection "upgrade";	

    }
}


server {
    listen 444 default_server ssl http2;
    listen [::]:444 ssl http2;

    server_name localhost virtual.robocross.ru;

    ssl_certificate /etc/letsencrypt/live/virtual.robocross.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/virtual.robocross.ru/privkey.pem;
    
    auth_basic off;

 
    location / {
        proxy_pass http://virtual.robocross.ru:8000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
#	proxy_set_header Referer $http_referer;
	add_header P3P 'CP=""';
	add_header X-Debug-Proto $scheme;

	# WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

 }
}

