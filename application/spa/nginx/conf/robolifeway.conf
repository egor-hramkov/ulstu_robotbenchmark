
server {
    listen 11932 default_server ssl http2;
    listen [::]:11932 ssl http2;

    server_name localhost virtual.robocross.ru;

    ssl_certificate /etc/letsencrypt/live/virtual.robocross.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/virtual.robocross.ru/privkey.pem;

    location / {
        proxy_pass http://virtual.robocross.ru:11931;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
#	proxy_set_header Referer $http_referer;
	add_header P3P 'CP=""';
	add_header X-Debug-Proto $scheme;

	# WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}


# VS Code server
server {
    listen 11768 ssl http2;
    listen [::]:11768 ssl http2;

    server_name virtual.robocross.ru;

    ssl_certificate /etc/letsencrypt/live/virtual.robocross.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/virtual.robocross.ru/privkey.pem;

    location / {
        proxy_pass http://localhost:11767;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade, Keep-Alive";
	
	proxy_set_header Origin "https://virtual.robocross.ru";
        proxy_set_header Host "virtual.robocross.ru";	

        # WebSocket
        proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
        proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;
        proxy_set_header Sec-WebSocket-Extensions $http_sec_websocket_extensions;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 86400s;	
    }
}

server {
    listen 11397 default_server ssl http2;
    listen [::]:11397 ssl http2;

    server_name localhost virtual.robocross.ru;

    ssl_certificate /etc/letsencrypt/live/virtual.robocross.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/virtual.robocross.ru/privkey.pem;

    location / {
        proxy_pass http://localhost:11396;
        proxy_http_version 1.1;

        # WebSocket Upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        # Оставляем корректные заголовки
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket-specific заголовки
        proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
        proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;
        proxy_set_header Sec-WebSocket-Extensions $http_sec_websocket_extensions;

        # Длинные таймауты для стабильности WebSocket
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 86400s;
    }
}

