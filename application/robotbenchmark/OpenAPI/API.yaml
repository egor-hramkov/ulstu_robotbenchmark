      tags:
      - leaderboard
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Leaderboard'
          description: ''
  /api/leaderboard/problem/{problem_id}/:
