      - problem
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProblem'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProblem'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProblem'
      security:
      - jwtAuth: []
      responses:
        '200':
