openapi: 3.0.3
info:
  title: Your Project API
  version: 1.0.0
  description: Your project description
paths:
  /api/block/{tournament_id}/:
    post:
      operationId: block_create
      parameters:
      - in: path
        name: tournament_id
        schema:
          type: integer
        required: true
      tags:
      - block
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/commands/:
    get:
      operationId: commands_retrieve
      tags:
      - commands
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/finish/{problemuser_id}:
    get:
      operationId: finish_retrieve
      description: Удаляет докер контейнер и файлы в ОС пользователя по айди записи
        в таблице ProblemUser
      parameters:
      - in: path
        name: problemuser_id
        schema:
          type: integer
        required: true
      tags:
      - finish
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/launch-user-problem/{problem_user_id}:
    get:
      operationId: launch_user_problem_retrieve
      description: Запуск решения командой пользователя (передача в контейнер команды)
      parameters:
      - in: path
        name: problem_user_id
        schema:
          type: integer
        required: true
      tags:
      - launch-user-problem
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
